onboarding = false

[terminal]
# PowerShell 7 (pwsh). Uses the stable App Execution Alias shim so it survives
# version updates, unlike the version-stamped WindowsApps package path.
default_shell = '__PWSH_PATH__'

[update]
channel = "preview"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false
